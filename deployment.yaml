apiVersion: apps/v1
kind: Deployment
metadata:
  name: dream-vault

spec:
  replicas: 2

  selector:
    matchLabels:
      app: dream-vault

  template:
    metadata:
      labels:
        app: dream-vault

    spec:
      containers:
      - name: dream-vault
        image: manoj0326/dream-vault:5

        ports:
        - containerPort: 80
